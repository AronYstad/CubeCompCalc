<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Competition Calculator</title>
    <link href="./styles/style.css" rel="stylesheet">
    <script src="./scripts/main.js" defer></script>
</head>
<body>
    <button id="home-button" type="button" onclick="window.location.href='index.html'">Home</button>
    <button id="logout-button" type="button">Change ID</button>
    <h1>Cube Competition Calculator</h1>
    <button id="id-mode-button" type="button">Load PRs from WCA ID</button>
    <h2 id="top-h2">or select format:</h2>

    <div id="event-select" style="display:none;">
        <button class="event-button" id="3x3">3x3</button>
        <button class="event-button" id="2x2">2x2</button>
        <button class="event-button" id="4x4">4x4</button>
        <button class="event-button" id="5x5">5x5</button>
        <button class="event-button" id="6x6">6x6</button>
        <button class="event-button" id="7x7">7x7</button>
        <button class="event-button" id="3bld">3BLD</button>
        <button class="event-button" id="oh">OH</button>
        <button class="event-button" id="clock">Clock</button>
        <button class="event-button" id="mega">Megaminx</button>
        <button class="event-button" id="pyra">Pyraminx</button>
        <button class="event-button" id="skewb">Skewb</button>
        <button class="event-button" id="squan">Square-1</button>
        <button class="event-button" id="4bld">4BLD</button>
        <button class="event-button" id="5bld">5BLD</button>
    </div>

    <input type="text" id="id-input" enterkeyhint="done" required style="display:none;">
    <button id="id-button" style="display:none;">Submit</button>
    <div class="format-buttons">
        <button class="format-button" id="ao5-button">Average of 5</button>
        <button class="format-button" id="mo3-button">Mean of 3</button>
    </div>
    <form id="pr-form" style="display:none;">
        <input type="text" id="pr-input" name="pr-input" inputmode="numeric" enterkeyhint="done" required value="0.00">
    </form>
    <h2 id="times-h2" style="display:none;">Enter times:</h2>
    <div id="times-container" style="display:none;">
        <input type="text" class="time-input" id="time1" inputmode="numeric" enterkeyhint="done" required value="0.00">
        <input type="text" class="time-input" id="time2" inputmode="numeric" enterkeyhint="done" required value="0.00">
        <input type="text" class="time-input" id="time3" inputmode="numeric" enterkeyhint="done" required value="0.00">
        <input type="text" class="time-input" id="time4" inputmode="numeric" enterkeyhint="done" required value="0.00">
        <input type="text" class="time-input" id="time5" inputmode="numeric" enterkeyhint="done" required value="0.00">
    </div>
    <h2 id="bpa-h2" style="display:none;">BPA: None</h2>
    <h2 id="wpa-h2" style="display:none;">WPA: None</h2>
    <h2 id="need-to-beat-h2" style="display:none;">Needed to tie PR: None</h2>
    <h2 id="average-h2" style="display:none;">Average: None</h2>
</body>
</html>
